name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build release app and ZIP
        run: ./scripts/package-release.sh 0.1.0
      - name: Verify app bundle
        run: codesign --verify --deep --strict dist/ReelConverter.app
      - uses: actions/upload-artifact@v4
        with:
          name: reelconverter-unsigned-${{ runner.arch }}
          path: dist/*.zip
